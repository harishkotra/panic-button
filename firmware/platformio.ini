; Panic Button — device firmware
; Target: ESP32-S3 (any N16R8 devkit) + SPI TFT (ILI9341 / ST7789 / ST7735)
;
; Build:   ~/Library/Python/3.12/bin/pio run -d firmware
; Flash:   ~/Library/Python/3.12/bin/pio run -d firmware -t upload
; Console: ~/Library/Python/3.12/bin/pio device monitor -d firmware
;
; Pins, panel type, WiFi and relay URL are NOT compiled in. The firmware boots
; into a serial provisioning console and stores the config in NVS, so one binary
; works on any S3 + SPI screen combination. See firmware/HARDWARE.md.
[env:esp32-s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.0
  bblanchon/ArduinoJson@^7.2.1
  ; ed25519 is vendored under firmware/lib/ed25519 (orlp/ed25519, CC0) because
  ; the registry package is not published for PlatformIO.
