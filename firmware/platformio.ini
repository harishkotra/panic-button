; Panic Button — reference firmware for YD-ESP32-S3 (N16R8) + ILI9341 2.4" SPI
; Build:  pio run -d firmware          Flash:  pio run -d firmware -t upload
; Note:   this file is the reference implementation. The relay and the browser
;         console are the parts exercised by scripts/verify.mjs; the firmware
;         needs the physical board and is not compiled in CI.
[env:yd-esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DUSER_SETUP_LOADED
  -DILI9341_2_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=8
  -DTFT_BL=7
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD
  -DFONT2
  -DSPI_FREQUENCY=40000000

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.1
  orlp/ed25519@^1.0.3
